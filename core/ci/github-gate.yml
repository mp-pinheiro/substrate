name: substrate-gate
on:
  push:
    branches: [main]
  pull_request: {}
concurrency:
  group: substrate-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
  issues: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install Jujutsu
        run: .substrate/install-jj.sh
      - name: Install Gitleaks
        run: .substrate/install-gitleaks.sh
      - name: Install substrate toolchain
        run: |
          bun install -g @ast-grep/cli@0.45.0 jscpd@5.0.14
          # substrate:profile-toolchain
      - name: Run gate
        run: .substrate/gate.sh
      - name: Audit plan oracles
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: '[ ! -d .pi/plans ] || .substrate/audit.sh'
      - name: Compute deep-scan cache key
        id: gitleaks-key
        run: echo "key=$(.substrate/gitleaks-deep.sh --print-key)" >> "$GITHUB_OUTPUT"
      - name: Restore deep-scan receipt
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .git/substrate/gitleaks-deep.json
          key: substrate-gitleaks-${{ runner.os }}-${{ steps.gitleaks-key.outputs.key }}
      - name: Scan full history for secrets
        run: .substrate/gitleaks-deep.sh
