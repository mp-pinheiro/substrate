name: substrate-gate
on:
  push:
    branches: [main]
  pull_request: {}
concurrency:
  group: substrate-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install container prerequisites
        run: .substrate/install-prereqs.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install Jujutsu
        run: .substrate/install-jj.sh
      - name: Install Gitleaks
        run: .substrate/install-gitleaks.sh
      - name: Install substrate toolchain
        run: |
          bun install -g @ast-grep/cli@0.45.0 jscpd@5.0.14
          # substrate:profile-toolchain
      - name: Resolve Substrate kit revision
        id: substrate-kit
        run: |
          source=$(jq -r '.source // ""' .substrate/vendor.json)
          version=$(jq -r '.version // ""' .substrate/vendor.json)
          revision=$(jq -r '.kitRevision // ""' .substrate/vendor.json)
          case "$source" in
            release|nightly|module)
              [ -n "$version" ] || {
                echo "::error::.substrate/vendor.json does not identify a published kit version"
                exit 1
              } ;;
            trunk)
              printf '%s\n' "$revision" | grep -Eq '^[0-9a-f]{40}$' || {
                echo "::error::.substrate/vendor.json does not identify a published kit revision"
                exit 1
              } ;;
            *)
              echo "::error::.substrate/vendor.json does not identify a published kit"
              exit 1 ;;
          esac
          {
            echo "source=$source"
            echo "version=$version"
            echo "revision=$revision"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.substrate-kit.outputs.source == 'trunk'
        with:
          repository: ${{ github.repository_owner }}/substrate
          ref: ${{ steps.substrate-kit.outputs.revision }}
          path: .substrate-kit
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.substrate-kit.outputs.source == 'trunk'
        with:
          go-version: '1.27.1'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.substrate-kit.outputs.source != 'trunk'
        with:
          go-version: stable
      - name: Build substrate engine from kit
        if: steps.substrate-kit.outputs.source == 'trunk'
        working-directory: .substrate-kit
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          go build -trimpath -buildvcs=false -ldflags "-X main.version=$(cat VERSION)" -o "$GITHUB_WORKSPACE/build/substrate-engine" ./cmd/substrate-engine
          echo "$GITHUB_WORKSPACE/build" >> "$GITHUB_PATH"
      - name: Install published substrate engine
        if: steps.substrate-kit.outputs.source != 'trunk'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          go install "github.com/mp-pinheiro/substrate/cmd/substrate@v${{ steps.substrate-kit.outputs.version }}"
          ln -sf "$(go env GOPATH)/bin/substrate" "$GITHUB_WORKSPACE/build/substrate-engine"
          echo "$GITHUB_WORKSPACE/build" >> "$GITHUB_PATH"
      - name: Run gate
        run: substrate-engine gate
      - name: Audit plan oracles
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: '[ ! -d .pi/plans ] || .substrate/audit.sh'
      - name: Compute deep-scan cache key
        id: gitleaks-key
        run: echo "key=$(.substrate/gitleaks-deep.sh --print-key)" >> "$GITHUB_OUTPUT"
      - name: Restore deep-scan receipt
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .git/substrate/gitleaks-deep.json
          key: substrate-gitleaks-${{ runner.os }}-${{ steps.gitleaks-key.outputs.key }}
      - name: Scan full history for secrets
        run: .substrate/gitleaks-deep.sh
