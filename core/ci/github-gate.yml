name: substrate-gate
on:
  push:
    branches: [main]
  pull_request: {}
concurrency:
  group: substrate-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
  issues: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install Jujutsu
        run: .substrate/install-jj.sh
      - name: Install substrate toolchain
        run: |
          bun install -g @ast-grep/cli@0.45.0 jscpd@5.0.14
          # substrate:profile-toolchain
      - name: Run gate
        run: .substrate/gate.sh
      - name: Audit plan oracles
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: '[ ! -d .pi/plans ] || .substrate/audit.sh'
      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
