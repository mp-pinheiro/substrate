name: substrate-report
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Run maintenance report
        run: |
          .substrate/report.sh > report.md
      - name: Upsert maintenance queue issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_TITLE: "Substrate maintenance report: cleanup candidates"
        run: |
          gh label create substrate-report --force --description "substrate maintenance queue" --color 5319e7
          n=$(gh api "repos/{owner}/{repo}/issues?labels=substrate-report&state=open" --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue edit "$n" --title "$REPORT_TITLE" --body-file report.md
          else
            gh issue create --title "$REPORT_TITLE" --label substrate-report --body-file report.md
          fi
