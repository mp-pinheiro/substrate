# substrate-repo-owned
name: substrate-release
on:
  workflow_dispatch:
    inputs:
      channel:
        description: release cuts a stable vX.Y.Z; nightly cuts a dated pre-release
        required: false
        default: release
        type: choice
        options: [release, nightly]
  schedule:
    - cron: '0 7 * * *'
concurrency:
  group: substrate-release-${{ github.workflow }}
  cancel-in-progress: false
jobs:
  release:
    if: ${{ !startsWith(github.server_url, 'https://github.com') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install container prerequisites
        run: .substrate/install-prereqs.sh
      - name: Require a green gate on this revision
        id: gate-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(.substrate/forge.sh ref-status "$GITHUB_SHA")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = success ]; then
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            echo "::notice::gate status for $GITHUB_SHA is '${status:-unknown}' — nothing to publish tonight"
            exit 0
          fi
          echo "::error::gate status for $GITHUB_SHA is '${status:-unknown}' — a stable release requires a green gate"
          exit 1
      - name: Mint the GitHub mirror token
        if: steps.gate-status.outputs.status == 'success'
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GH_MIRROR_REPO: mp-pinheiro/substrate
        run: |
          if [ -z "${GH_APP_ID:-}" ] || [ -z "${GH_APP_PRIVATE_KEY:-}" ]; then
            echo "::error::GH_APP_ID / GH_APP_PRIVATE_KEY are not configured — the GitHub App mints the mirror credential"
            exit 1
          fi
          token=$(.substrate/gh-app-token.sh)
          echo "::add-mask::$token"
          echo "MIRROR_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Resolve release identity
        id: identity
        if: steps.gate-status.outputs.status == 'success'
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_CHANNEL: ${{ inputs.channel || github.event.inputs.channel }}
          RELEASE_HEAD_SHA: ${{ github.sha }}
        run: .substrate/release-identity.sh
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.gate-status.outputs.status == 'success' && steps.identity.outputs.skip != 'true'
        with:
          go-version-file: go.mod
      - name: Build release artifacts
        if: steps.gate-status.outputs.status == 'success' && steps.identity.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          CHANNEL: ${{ steps.identity.outputs.channel }}
        run: |
          if [ -z "$VERSION" ] || [ -z "$CHANNEL" ]; then
            echo "::error::identity produced no version/channel — refusing to build an unnamed release"
            exit 1
          fi
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -buildvcs=false \
              -ldflags "-X main.version=$VERSION -X main.channel=$CHANNEL -X main.kitRevision=$GITHUB_SHA" \
              -o dist/substrate ./cmd/substrate
            ln -sf substrate dist/substrate-engine
            tar -czf "substrate_${VERSION}_linux_${arch}.tar.gz" -C dist substrate substrate-engine
            rm -rf dist
          done
          sha256sum substrate_*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Compose release notes
        if: steps.gate-status.outputs.status == 'success' && steps.identity.outputs.skip != 'true'
        env:
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          previous=$(git describe --tags --abbrev=0 2>/dev/null) || previous=""
          if [ -n "$previous" ]; then
            git log "$previous..HEAD" --pretty='* %s' > notes.md
          else
            git log -20 --pretty='* %s' > notes.md
          fi
          printf '\nRevision: %s\n' "$GITHUB_SHA" >> notes.md
          cat notes.md
      - name: Publish to Forgejo and the GitHub mirror
        if: steps.gate-status.outputs.status == 'success' && steps.identity.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
          PRERELEASE: ${{ steps.identity.outputs.prerelease }}
          BASE: ${{ steps.identity.outputs.base }}
          NIGHTLY_BASE: ${{ steps.identity.outputs.nightlybase }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_HEAD_SHA: ${{ github.sha }}
        run: |
          publish() {
            id=$(.substrate/forge.sh create-release "$TAG" "$TAG" "$PRERELEASE" notes.md "$1")
            for asset in substrate_*.tar.gz SHA256SUMS; do
              .substrate/forge.sh upload-asset "$id" "$asset"
            done
            .substrate/forge.sh prune-prereleases "v${BASE}-nightly." 14
            [ "$NIGHTLY_BASE" = "$BASE" ] \
              || .substrate/forge.sh prune-prereleases "v${NIGHTLY_BASE}-nightly." 14
          }
          publish "$GITHUB_SHA"
          .substrate/release-mirror-tag.sh
          export SUBSTRATE_FORGE_API=https://api.github.com
          export SUBSTRATE_FORGE_SLUG=mp-pinheiro/substrate
          export SUBSTRATE_FORGE_TOKEN="$MIRROR_TOKEN"
          publish ""
