# substrate-repo-owned
name: substrate-release
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 7 * * *'
concurrency:
  group: substrate-release-${{ github.workflow }}
  cancel-in-progress: false
jobs:
  release:
    if: ${{ !startsWith(github.server_url, 'https://github.com') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install container prerequisites
        run: .substrate/install-prereqs.sh
      - name: Resolve the GitHub mirror credential
        id: mirror-auth
        env:
          MIRROR_GITHUB_TOKEN: ${{ secrets.MIRROR_GITHUB_TOKEN }}
          MIRROR_APP_ID: ${{ secrets.MIRROR_APP_ID }}
          MIRROR_APP_PRIVATE_KEY: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
        run: |
          if [ -n "${MIRROR_GITHUB_TOKEN:-}" ]; then
            echo "::add-mask::$MIRROR_GITHUB_TOKEN"
            echo "MIRROR_TOKEN=$MIRROR_GITHUB_TOKEN" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "${MIRROR_APP_ID:-}" ] || [ -z "${MIRROR_APP_PRIVATE_KEY:-}" ]; then
            echo "::error::no GitHub mirror credential — set MIRROR_APP_ID + MIRROR_APP_PRIVATE_KEY (GitHub App) or MIRROR_GITHUB_TOKEN (PAT); a release that exists only on Forgejo breaks go install"
            exit 1
          fi
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now=$(date +%s)
          header=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
          payload=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((now - 60))" "$((now + 540))" "$MIRROR_APP_ID" | b64url)
          key=$(mktemp)
          chmod 600 "$key"
          printf '%s\n' "$MIRROR_APP_PRIVATE_KEY" > "$key"
          signature=$(printf '%s.%s' "$header" "$payload" | openssl dgst -sha256 -sign "$key" | b64url)
          rm -f "$key"
          jwt="$header.$payload.$signature"
          installation=$(curl -sSf -H "Authorization: Bearer $jwt" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/mp-pinheiro/substrate/installation | jq -r '.id // empty')
          if [ -z "$installation" ]; then
            echo "::error::the GitHub App is not installed on mp-pinheiro/substrate — install it, then re-dispatch"
            exit 1
          fi
          token=$(curl -sSf -X POST -H "Authorization: Bearer $jwt" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/app/installations/$installation/access_tokens" | jq -r '.token // empty')
          if [ -z "$token" ]; then
            echo "::error::the GitHub App installation returned no access token"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "MIRROR_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Require a green gate on this revision
        id: gate-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(.substrate/forge.sh ref-status "$GITHUB_SHA")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = success ]; then
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            echo "::notice::gate status for $GITHUB_SHA is '${status:-unknown}' — nothing to publish tonight"
            exit 0
          fi
          echo "::error::gate status for $GITHUB_SHA is '${status:-unknown}' — a stable release requires a green gate"
          exit 1
      - name: Resolve release identity
        id: identity
        if: steps.gate-status.outputs.status == 'success'
        run: |
          base=$(cat VERSION)
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            version="${base}-nightly.$(date -u +%Y%m%d)"
            channel=nightly
            prerelease=true
          else
            version="$base"
            channel=release
            prerelease=false
          fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag already exists in this checkout"
            exit 1
          fi
          if curl -sSf -o /dev/null \
              -H "Authorization: token $MIRROR_TOKEN" \
              "https://api.github.com/repos/mp-pinheiro/substrate/releases/tags/$tag" 2>/dev/null; then
            echo "::error::release $tag already exists on the GitHub mirror"
            exit 1
          fi
          {
            echo "base=$base"
            echo "version=$version"
            echo "channel=$channel"
            echo "prerelease=$prerelease"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.gate-status.outputs.status == 'success'
        with:
          go-version-file: go.mod
      - name: Build release artifacts
        if: steps.gate-status.outputs.status == 'success'
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          CHANNEL: ${{ steps.identity.outputs.channel }}
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -buildvcs=false \
              -ldflags "-X main.version=$VERSION -X main.channel=$CHANNEL -X main.kitRevision=$GITHUB_SHA" \
              -o dist/substrate ./cmd/substrate
            ln -sf substrate dist/substrate-engine
            tar -czf "substrate_${VERSION}_linux_${arch}.tar.gz" -C dist substrate substrate-engine
            rm -rf dist
          done
          sha256sum substrate_*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Compose release notes
        if: steps.gate-status.outputs.status == 'success'
        env:
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          previous=$(git describe --tags --abbrev=0 2>/dev/null) || previous=""
          if [ -n "$previous" ]; then
            git log "$previous..HEAD" --pretty='* %s' > notes.md
          else
            git log -20 --pretty='* %s' > notes.md
          fi
          printf '\nRevision: %s\n' "$GITHUB_SHA" >> notes.md
          cat notes.md
      - name: Publish to Forgejo and the GitHub mirror
        if: steps.gate-status.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
          PRERELEASE: ${{ steps.identity.outputs.prerelease }}
          BASE: ${{ steps.identity.outputs.base }}
        run: |
          publish() {
            id=$(.substrate/forge.sh create-release "$TAG" "$TAG" "$PRERELEASE" notes.md "$1")
            for asset in substrate_*.tar.gz SHA256SUMS; do
              .substrate/forge.sh upload-asset "$id" "$asset"
            done
            .substrate/forge.sh prune-prereleases "v${BASE}-nightly." 14
          }
          publish "$GITHUB_SHA"
          mirror_tree=$(curl -sSf -H "Authorization: token $MIRROR_TOKEN" \
            "https://api.github.com/repos/mp-pinheiro/substrate/commits/main" | jq -r '.commit.tree.sha')
          if [ "$mirror_tree" != "$(git rev-parse 'HEAD^{tree}')" ]; then
            echo "::error::mirror main tree differs from the released revision — wait for the push mirror, then re-dispatch"
            exit 1
          fi
          export SUBSTRATE_FORGE_API=https://api.github.com
          export SUBSTRATE_FORGE_SLUG=mp-pinheiro/substrate
          export SUBSTRATE_FORGE_TOKEN="$MIRROR_TOKEN"
          publish main
