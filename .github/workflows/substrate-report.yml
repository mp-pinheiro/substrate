# substrate-managed
name: substrate-report
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}
concurrency:
  group: substrate-report
  cancel-in-progress: true
permissions:
  contents: read
  issues: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install report prerequisites
        run: |
          # Forgejo's root job container lacks jq/pipx that report.sh needs for jscpd and vulture;
          # GitHub's ubuntu-latest runner already has both as a non-root user.
          [ "$(id -u)" -eq 0 ] || exit 0
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends jq pipx
      - name: Run maintenance report
        run: |
          .substrate/report.sh > report.md
      - name: Upsert maintenance queue issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_TITLE: "Substrate maintenance report: cleanup candidates"
        run: .substrate/forge.sh upsert-issue substrate-report "$REPORT_TITLE" report.md
