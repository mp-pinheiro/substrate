# substrate-repo-owned
name: substrate-gate
on:
  push:
    branches: [main]
  pull_request: {}
concurrency:
  group: substrate-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
  issues: read
env:
  SUBSTRATE_VENDOR_FROM_WORKTREE: '1'
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - &setup_bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - &install_core
        name: Install core toolchain
        run: bun install -g @ast-grep/cli@0.45.0 jscpd@5.0.14
      - name: Install active profile toolchains
        run: test/ci-toolchain.sh --active
      - &install_go
        name: Install Go toolchain
        run: test/ci-toolchain.sh go
      - &build_engine
        name: Build engine
        run: |
          go build -trimpath -buildvcs=false -o build/substrate-engine ./cmd/substrate-engine
          echo "$PWD/build" >> "$GITHUB_PATH"
      - name: Run gate
        run: substrate-engine gate
      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  profile-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        profile: [airflow, base, cpp, dbt, go, lua, python, shell, sql, svelte, terraform, typescript]
    steps:
      - &checkout_shallow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *setup_bun
      - *install_core
      - *install_go
      - *build_engine
      - name: Install profile toolchain
        run: test/ci-toolchain.sh ${{ matrix.profile }}
      - name: Hostile-HOME oracle
        run: test/hostile-home.sh ${{ matrix.profile }}
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - *checkout_shallow
      - *install_go
      - name: Provision pinned jq
        run: test/ci-toolchain.sh --ensure-jq
      - name: Build, vet, and internal tests
        run: |
          go build -trimpath -buildvcs=false -ldflags "-X main.version=$(cat VERSION)" ./...
          go vet ./...
          go test ./internal/...
  hook-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - *checkout_shallow
      - *setup_bun
      - *install_core
      - &install_jj
        name: Install Jujutsu
        run: .substrate/install-jj.sh
      - *install_go
      - *build_engine
      - name: Go-only hook parity
        run: bash test/ab-hooks-test.sh
      - name: Session-ledger golden vectors (go-only)
        run: bash test/golden-ledger-test.sh
      - name: Engine rollback switch
        run: bash test/engine-rollback-test.sh

  transaction-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout_shallow
      - *setup_bun
      - *install_core
      - *install_jj
      - *install_go
      - *build_engine
      - name: Checkpoint rollback switch
        run: bash test/transaction-rollback-test.sh

  maintenance-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout_shallow
      - *setup_bun
      - *install_core
      - *install_jj
      - *install_go
      - *build_engine
      - name: Maintenance rollback switch
        run: bash test/maintenance-rollback-test.sh
      - name: Maintenance A/B diff
        run: bash test/maintenance-ab-test.sh
      - name: Receipt A/B comparison
        run: bash test/maintenance-receipt-ab-test.sh
  audit:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [gate, profile-matrix, engine, hook-parity, maintenance-parity, transaction-parity]
    steps:
      - *checkout_shallow
      - *setup_bun
      - *install_jj
      - name: Install core + all profile toolchains
        run: |
          bun install -g @ast-grep/cli@0.45.0 jscpd@5.0.14
          test/ci-toolchain.sh
      - *install_go
      - *build_engine
      - name: Audit plan oracles
        env:
          GH_TOKEN: ${{ github.token }}
          SUBSTRATE_AUDIT_JOBS: '4'
        run: bin/substrate audit
