# substrate-repo-owned
name: substrate-gate
on:
  push:
    branches: [main]
  pull_request: {}
concurrency:
  group: substrate-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
  issues: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - &setup_bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - &install_core
        name: Install core toolchain
        run: bun install -g @ast-grep/cli@0.45.0 jscpd@5.0.14
      - name: Install active profile toolchains
        run: test/ci-toolchain.sh --active
      - name: Run gate
        run: .substrate/gate.sh
      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  profile-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        profile: [airflow, base, cpp, dbt, go, lua, python, shell, sql, svelte, terraform, typescript]
    steps:
      - &checkout_shallow
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - *setup_bun
      - *install_core
      - name: Install profile toolchain
        run: test/ci-toolchain.sh ${{ matrix.profile }}
      - name: Hostile-HOME oracle
        run: test/hostile-home.sh ${{ matrix.profile }}
  audit:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [gate, profile-matrix]
    steps:
      - *checkout_shallow
      - *setup_bun
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: jj-cli@0.43.0
          fallback: none
      - name: Install core + all profile toolchains
        run: |
          bun install -g @ast-grep/cli@0.45.0 jscpd@5.0.14
          test/ci-toolchain.sh
      - name: Audit plan oracles
        env:
          GH_TOKEN: ${{ github.token }}
          SUBSTRATE_AUDIT_JOBS: '4'
        run: bin/substrate audit
